<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="Simona Vrabiescu — Profile">
  <title>Simona Vrabiescu — Profile</title>
  <style>
    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: #f3f4f6;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      margin: 0;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #f3f4f6;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
    }

    /* Keyframe animation for one-time swoop entrance */
    @keyframes swoopIn {
      0% {
        transform: translateY(32px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .profile-card {
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
      
      /* Runs once on page load (0.45s smooth swoop) */
      animation: swoopIn 450ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .profile-header {
      height: 110px;
      flex: 0 0 auto;
      background: #4f46e5 url("assets/images/cover.svg") center / cover no-repeat;
    }

    .profile-content {
      width: 100%;
      padding: 1.75rem 1.75rem 1.75rem;
      text-align: center;
    }

    .profile-name {
      margin: 0 0 0.85rem 0;
      font-size: clamp(2.75rem, 9vw, 3.85rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .profile-bio {
      max-width: 44ch;
      margin: 0 auto 1.5rem;
      color: #374151;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      line-height: 1.5;
      font-weight: 450;
    }

    .profile-links {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      gap: 0.75rem;
    }

    .profile-link {
      min-height: 52px;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      font-size: clamp(1rem, 2.8vw, 1.1rem);
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.2);
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .profile-link:hover { background: #4338ca; transform: translateY(-1px); }
    .profile-link:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    .profile-link.email { 
      border-color: #d1d5db; 
      background: #fff; 
      color: #1f2937; 
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .profile-link.email:hover { background: #f9fafb; }
    .profile-link svg { width: 20px; height: 20px; flex: 0 0 auto; }

    @media (max-width: 600px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .profile-card {
        border-radius: 18px;
      }

      .profile-header { height: 100px; }
      .profile-content { padding: 1.5rem 1.25rem 1.5rem; }
      .profile-name { font-size: clamp(2.5rem, 11vw, 3.4rem); margin-bottom: 0.75rem; }
      .profile-bio { font-size: 0.95rem; line-height: 1.45; margin-bottom: 1.25rem; }
      .profile-link { min-height: 50px; font-size: 1.05rem; }
    }

    /* Fallback: completely disables animation for users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { 
        scroll-behavior: auto !important; 
        transition-duration: 0.01ms !important; 
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card" aria-labelledby="profile-name">
      <div class="profile-header" role="img" aria-label="Abstract header background"></div>
      <div class="profile-content">
        <h1 class="profile-name" id="profile-name">Simona Vrabiescu</h1>
        <p class="profile-bio">
          Marketing expert with broad technical and business skills, driving 360° brand strategies and global operational execution across B2B and B2C markets.
        </p>
        <nav class="profile-links" aria-label="Contact links">
          <a class="profile-link" href="https://linkedin.com/in/simona-vrabiescu" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM8.06 18.34H5.1V9h2.96v9.34ZM6.58 7.72a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.1 10.62h-2.95v-4.54c0-1.08-.02-2.47-1.5-2.47-1.5 0-1.73 1.17-1.73 2.39v4.62H9.55V9h2.83v1.28h.04c.39-.74 1.36-1.52 2.8-1.52 3 0 3.56 1.97 3.56 4.53v5.05Z"/></svg>
            Connect on LinkedIn
          </a>
          <a class="profile-link email" href="mailto:hs.consult@bluewin.ch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Send me an email
          </a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
