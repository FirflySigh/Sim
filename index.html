<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="Simona Vrabiescu — Profile">
  <title>Simona Vrabiescu — Profile</title>
  <style>
    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: #f3f4f6;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      margin: 0;
      /* Reduced outer padding for maximum card visibility on mobile */
      padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #f3f4f6;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: 100%;
      min-height: calc(100vh - 16px);
      min-height: calc(100svh - 16px);
      min-height: calc(100dvh - max(16px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      display: grid;
      place-items: center;
    }

    .profile-card {
      width: 100%;
      max-width: 680px;
      min-height: 0; /* Tightened vertical footprint */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgb(15 23 42 / 12%);
    }

    .profile-header {
      min-height: clamp(100px, 16vh, 160px);
      flex: 0 0 auto;
      background: #4f46e5 url("assets/images/cover.svg") center / cover no-repeat;
    }

    .profile-content {
      width: 100%;
      margin: 0 auto;
      /* Reduced top & bottom padding */
      padding: clamp(1rem, 2.5vh, 1.5rem) clamp(1.25rem, 5vw, 2.5rem);
      text-align: center;
    }

    .profile-name {
      margin: 0;
      /* Made text bigger */
      font-size: clamp(2.6rem, 8.5vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .profile-handle {
      margin: 0.5rem 0 1rem;
      color: #4b5563;
      /* Made text bigger */
      font-size: clamp(1.25rem, 3.5vw, 1.55rem);
      font-weight: 600;
    }

    .profile-bio {
      max-width: 44ch;
      margin: 0 auto 1.25rem;
      color: #374151;
      /* Made text bigger */
      font-size: clamp(1.2rem, 3.2vw, 1.45rem);
      line-height: 1.55;
    }

    .profile-links {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      gap: 1rem;
    }

    .profile-link {
      /* Made buttons significantly larger with higher visibility */
      min-height: 84px;
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border: 2.5px solid transparent;
      border-radius: 18px;
      background: #4f46e5;
      color: #fff;
      font-size: clamp(1.3rem, 4vw, 1.55rem);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .profile-link:hover { background: #4338ca; transform: translateY(-1px); }
    .profile-link:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    .profile-link.email { 
      border-color: #d1d5db; 
      background: #fff; 
      color: #1f2937; 
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    .profile-link.email:hover { background: #f9fafb; }
    .profile-link svg { width: 30px; height: 30px; flex: 0 0 auto; }

    @media (max-width: 600px) {
      body {
        /* Edge-to-edge layout optimization for mobile */
        padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .profile-card {
        border-radius: 20px;
      }

      .profile-header { min-height: 100px; }
      .profile-content { padding: 1.25rem 1rem; }
      .profile-name { font-size: clamp(2.4rem, 10vw, 3.4rem); }
      .profile-handle { font-size: 1.3rem; margin-bottom: 0.75rem; }
      .profile-bio { font-size: 1.25rem; line-height: 1.5; margin-bottom: 1.25rem; }
      .profile-link { min-height: 80px; font-size: 1.35rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card" aria-labelledby="profile-name">
      <div class="profile-header" role="img" aria-label="Abstract header background"></div>
      <div class="profile-content">
        <h1 class="profile-name" id="profile-name">Simona Vrabiescu</h1>
        <p class="profile-handle">Consultant &amp; Professional</p>
        <p class="profile-bio">
          I create thoughtful digital experiences and accessible, easy-to-use solutions.
        </p>
        <nav class="profile-links" aria-label="Contact links">
          <a class="profile-link" href="https://linkedin.com/in/simona-vrabiescu" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM8.06 18.34H5.1V9h2.96v9.34ZM6.58 7.72a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.1 10.62h-2.95v-4.54c0-1.08-.02-2.47-1.5-2.47-1.5 0-1.73 1.17-1.73 2.39v4.62H9.55V9h2.83v1.28h.04c.39-.74 1.36-1.52 2.8-1.52 3 0 3.56 1.97 3.56 4.53v5.05Z"/></svg>
            Connect on LinkedIn
          </a>
          <a class="profile-link email" href="mailto:hs.consult@bluewin.ch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Send me an email
          </a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
