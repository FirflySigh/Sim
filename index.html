<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="Aurora Chen — designer and front-end developer.">
  <title>Aurora Chen — Profile</title>
  <style>
    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: #f3f4f6;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      margin: 0;
      padding: max(10px, env(safe-area-inset-top)) max(10vw, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10vw, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #f3f4f6;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: 100%;
      min-height: calc(100vh - 20px);
      min-height: calc(100svh - 20px);
      min-height: calc(100dvh - max(20px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      display: grid;
      place-items: center;
    }

    .profile-card {
      width: 100%;
      min-height: min(760px, calc(100dvh - 40px));
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgb(15 23 42 / 12%);
    }

    .profile-header {
      min-height: clamp(120px, 20vh, 200px);
      flex: 0 0 auto;
      background: #4f46e5 url("assets/images/cover.svg") center / cover no-repeat;
    }

    .profile-content {
      width: min(100%, 760px);
      margin: auto;
      padding: clamp(1.25rem, 3vh, 2rem) clamp(1.25rem, 6vw, 3.5rem);
      text-align: center;
    }

    .profile-name {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 3.75rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .profile-handle {
      margin: 0.6rem 0 1rem;
      color: #6b7280;
      font-size: clamp(1.15rem, 3vw, 1.4rem);
    }

    .profile-bio {
      max-width: 42ch;
      margin: 0 auto 1.5rem;
      color: #374151;
      font-size: clamp(1.15rem, 3vw, 1.35rem);
      line-height: 1.65;
    }

    .profile-links {
      width: min(100%, 520px);
      margin: 0 auto;
      display: grid;
      gap: 0.85rem;
    }

    .profile-link {
      min-height: 78px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      border: 2px solid transparent;
      border-radius: 16px;
      background: #4f46e5;
      color: #fff;
      font-size: clamp(1.2rem, 3vw, 1.4rem);
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .profile-link:hover { background: #4338ca; transform: translateY(-1px); }
    .profile-link:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    .profile-link.email { border-color: #d1d5db; background: #fff; color: #374151; }
    .profile-link.email:hover { background: #f9fafb; }
    .profile-link svg { width: 26px; height: 26px; flex: 0 0 auto; }

    @media (max-width: 600px) {
      body {
        padding: max(8px, env(safe-area-inset-top)) max(10vw, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10vw, env(safe-area-inset-left));
      }

      main {
        min-height: calc(100vh - 16px);
        min-height: calc(100svh - 16px);
        min-height: calc(100dvh - max(16px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
      }

      .profile-card {
        min-height: min(720px, calc(100dvh - 32px));
        border-radius: 22px;
      }

      .profile-header { min-height: clamp(110px, 17vh, 160px); }
      .profile-content { padding: clamp(1rem, 2.5vh, 1.5rem) 1rem; }
      .profile-name { font-size: clamp(2.2rem, 9vw, 3.2rem); }
      .profile-handle { font-size: 1.15rem; }
      .profile-bio { font-size: 1.2rem; line-height: 1.6; margin-bottom: 1.25rem; }
      .profile-link { min-height: 74px; font-size: 1.25rem; }
    }

    @media (max-height: 650px) {
      .profile-card { min-height: 0; }
      .profile-header { min-height: 90px; }
      .profile-content { padding-top: 0.9rem; padding-bottom: 0.9rem; }
      .profile-handle { margin-bottom: 0.6rem; }
      .profile-bio { margin-bottom: 0.9rem; }
      .profile-link { min-height: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card" aria-labelledby="profile-name">
      <div class="profile-header" role="img" aria-label="Abstract purple and blue gradient artwork"></div>
      <div class="profile-content">
        <h1 class="profile-name" id="profile-name">Aurora Chen</h1>
        <p class="profile-handle">Designer &amp; front-end developer</p>
        <p class="profile-bio">
          I create thoughtful digital experiences and accessible, easy-to-use websites.
          Based in Neo-Kyoto.
        </p>
        <nav class="profile-links" aria-label="Contact links">
          <a class="profile-link" href="https://www.linkedin.com/in/your-profile/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM8.06 18.34H5.1V9h2.96v9.34ZM6.58 7.72a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.1 10.62h-2.95v-4.54c0-1.08-.02-2.47-1.5-2.47-1.5 0-1.73 1.17-1.73 2.39v4.62H9.55V9h2.83v1.28h.04c.39-.74 1.36-1.52 2.8-1.52 3 0 3.56 1.97 3.56 4.53v5.05Z"/></svg>
            Connect on LinkedIn
          </a>
          <a class="profile-link email" href="mailto:you@example.com">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Send me an email
          </a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
