    @keyframes swoopIn {

    .profile-card {

      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
      
      /* Slower 900ms duration with smooth spring physics */
      animation: swoopIn 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
